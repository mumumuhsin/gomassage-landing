<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Mitra Terapis - GO Massage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F0F4F8;
            --card-bg: #FFFFFF;
            --dark: #004E9B;
            --accent: #0091B9;
            --orange: #FF6500;
            --text: #1C2833;
            --muted: #5D6D7E;
            --border: #D4E6F1;
            --radius: 20px;
            --shadow: 0 15px 35px rgba(0, 78, 155, 0.1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #BAE4F0 0%, #F0F4F8 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Navigation */
        .top-nav {
            width: 100%;
            max-width: 640px;
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--dark);
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0, 78, 155, 0.08);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-back .arrow-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            background: var(--bg-soft, #BAE4F0);
            color: var(--dark);
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease;
        }

        .btn-back:hover {
            background: var(--dark);
            color: #ffffff;
            border-color: var(--dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 78, 155, 0.2);
        }

        .btn-back:hover .arrow-icon {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: translateX(-3px);
        }

        /* Container Card */
        .form-card {
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 36px 28px;
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--accent) 0%, var(--dark) 100%);
        }

        .header-title {
            margin-bottom: 28px;
        }

        .header-title h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 26px;
            color: var(--dark);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header-title p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: var(--dark);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: #F8FAFC;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(0, 145, 185, 0.12);
        }

        /* Checkbox Grid for Skills */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        .skill-item {
            position: relative;
        }

        .skill-item input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .skill-label {
            display: block;
            padding: 10px 12px;
            background: #F8FAFC;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--muted);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .skill-item input:checked + .skill-label {
            background: rgba(0, 145, 185, 0.1);
            border-color: var(--accent);
            color: var(--dark);
            font-weight: 600;
        }

        /* Submit Button */
        .btn-submit {
            background: linear-gradient(135deg, #0091B9 0%, #004E9B 100%);
            color: #ffffff;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 145, 185, 0.35);
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 145, 185, 0.45);
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 24px 18px;
            }
            .header-title h1 {
                font-size: 22px;
            }
            .skills-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <div class="top-nav">
        <a href="index.html" class="btn-back">
            <span class="arrow-icon">←</span>
            <span>Kembali ke Beranda</span>
        </a>
    </div>

    <!-- Form Card -->
    <div class="form-card">
        <div class="header-title">
            <h1>Pendaftaran Mitra Terapis</h1>
            <p>Lengkapi formulir profesional di bawah ini untuk bergabung sebagai mitra terapis GO Massage.</p>
        </div>

        <form id="terapisForm" onsubmit="sendToWhatsApp(event)">
            <!-- Nama -->
            <div class="form-group">
                <label for="nama">Nama Lengkap (Sesuai KTP)</label>
                <input type="text" id="nama" required placeholder="Masukkan nama lengkap Anda">
            </div>

            <!-- Whatsapp -->
            <div class="form-group">
                <label for="whatsapp">Nomor WhatsApp Aktif</label>
                <input type="tel" id="whatsapp" required placeholder="Contoh: 081234567890">
            </div>

            <!-- Alamat Lengkap -->
            <div class="form-group">
                <label for="alamat">Alamat Lengkap</label>
                <textarea id="alamat" rows="2" required placeholder="Jl. Raya No. 123, RT/RW, Kelurahan, Kecamatan"></textarea>
            </div>

            <!-- Kota / Wilayah -->
            <div class="form-group">
                <label for="kota">Kota</label>
                <select id="kota" required>
                    <option value="">-- Pilih Kota / Area --</option>
                    <option value="Jakarta Selatan">Jakarta Selatan</option>
                    <option value="Jakarta Pusat">Jakarta Pusat</option>
                    <option value="Jakarta Barat">Jakarta Barat</option>
                    <option value="Jakarta Timur">Jakarta Timur</option>
                    <option value="Jakarta Utara">Jakarta Utara</option>
                    <option value="Bekasi">Bekasi</option>
                    <option value="Depok">Depok</option>
                    <option value="Tangerang">Tangerang / Tangerang Selatan</option>
                    <option value="Bogor">Bogor</option>
                </select>
            </div>

            <!-- Skill yang Dikuasai -->
            <div class="form-group">
                <label>Skill yang di Kuasai</label>
                <div class="skills-grid">
                    <div class="skill-item">
                        <input type="checkbox" id="s1" value="Full Body Massage">
                        <label for="s1" class="skill-label">Full Body</label>
                    </div>
                    <div class="skill-item">
                        <input type="checkbox" id="s2" value="Foot Reflexology">
                        <label for="s2" class="skill-label">Foot Reflexology</label>
                    </div>
                    <div class="skill-item">
                        <input type="checkbox" id="s3" value="Bekam">
                        <label for="s3" class="skill-label">Bekam</label>
                    </div>
                    <div class="skill-item">
                        <input type="checkbox" id="s4" value="Full Body + Scrub">
                        <label for="s4" class="skill-label">Full Body + Scrub</label>
                    </div>
                    <div class="skill-item">
                        <input type="checkbox" id="s5" value="Kerokan">
                        <label for="s5" class="skill-label">Full Body + Kerokan</label>
                    </div>
                    <div class="skill-item">
                        <input type="checkbox" id="s6" value="Kids Massage">
                        <label for="s6" class="skill-label">Kids Massage</label>
                    </div>
                    <div class="skill-item">
                        <input type="checkbox" id="s7" value="Keseleo / Terkilir">
                        <label for="s7" class="skill-label">Keseleo / Terkilir</label>
                    </div>
                    <div class="skill-item">
                        <input type="checkbox" id="s8" value="Totok Wajah">
                        <label for="s8" class="skill-label">Totok Wajah</label>
                    </div>
                    <div class="skill-item">
                        <input type="checkbox" id="s9" value="Akupuntur">
                        <label for="s9" class="skill-label">Akupuntur</label>
                    </div>
                    <div class="skill-item">
                        <input type="checkbox" id="s10" value="Maternity (Ibu Hamil)">
                        <label for="s10" class="skill-label">Maternity</label>
                    </div>
                    <div class="skill-item">
                        <input type="checkbox" id="s11" value="Sport Massage">
                        <label for="s11" class="skill-label">Sport Massage</label>
                    </div>
                    <div class="skill-item">
                        <input type="checkbox" id="s12" value="Hot Stone">
                        <label for="s12" class="skill-label">Hot Stone</label>
                    </div>
                </div>
                <input type="text" id="skill_lain" placeholder="Keahlian / Treatment khusus lainnya..." style="margin-top: 8px;">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">
                <span>Kirim Pendaftaran via WhatsApp</span>
                <span>📲</span>
            </button>
        </form>

        <div class="footer-note">
            © 2026 GO Massage Indonesia. Privasi & Data Anda Terjaga.
        </div>
    </div>

    <script>
        function sendToWhatsApp(e) {
            e.preventDefault();

            const nama = document.getElementById('nama').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const alamat = document.getElementById('alamat').value;
            const kota = document.getElementById('kota').value;
            const skillLain = document.getElementById('skill_lain').value;

            let selectedSkills = [];
            document.querySelectorAll('.skill-item input[type="checkbox"]:checked').forEach(cb => {
                selectedSkills.push(cb.value);
            });
            if (skillLain.trim() !== '') {
                selectedSkills.push(skillLain.trim());
            }
            const strSkills = selectedSkills.length > 0 ? selectedSkills.join(', ') : 'Belum diisi';

            const adminPhone = "6281932963534";

            const text = `Halo Admin GO Massage,%0A%0ASaya ingin mendaftar sebagai *Mitra Terapis GO Massage*. Berikut detail data diri saya:%0A%0A👤 *Nama:* ${nama}%0A📱 *No WA:* ${whatsapp}%0A🏠 *Alamat Lengkap:* ${alamat}%0A📍 *Kota:* ${kota}%0A💆 *Skill yang dikuasai:* ${strSkills}%0A%0AMohon diproses pendaftaran saya. Terima kasih!`;

            window.open(`https://wa.me/${adminPhone}?text=${text}`, '_blank');

            // Mengosongkan kembali form setelah terkirim
            document.getElementById('terapisForm').reset();
        }
    </script>
</body>
</html>
